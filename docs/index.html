<script>
"use strict";
const START_YM="2026-10";
const CAP=14.5;
const TIERS=[[24000,1],[28000,2],[32000,3],[35000,4]];
const NG="main.ng_public";
const $=id=>document.getElementById(id);
const nf=(v,d=0)=>(v==null||!isFinite(v))?"—":(+v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=(v,d=0)=>v==null||!isFinite(v)?"—":"€"+nf(v,d);
const pct=(v,d=1)=>v==null||!isFinite(v)?"—":nf(v,d)+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const iso=d=>d.toISOString().slice(0,10);
const U=(y,m,d)=>new Date(Date.UTC(y,m,d));
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return U(y,m-1,d);};
function madridToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid"}).format(new Date());}
function setStatus(t,err){const s=$("status");s.className="status pad"+(err?" err":"");$("stTxt").textContent=t;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// ---------- consultas ----------
function monthInfo(ym){
  const [y,m]=ym.split("-").map(Number);
  const ms=U(y,m-1,1), me=U(y,m,0);
  const today=parseD(madridToday()), yest=addD(today,-1);
  const closed=me<=yest;
  const dataEnd=closed?me:(yest<ms?addD(ms,-1):yest);
  const first=addD(ms,-((ms.getUTCDay()+6)%7));
  return {ym,ms,me,today,yest,closed,dataEnd,first,days:me.getUTCDate(),elapsed:Math.max(0,dataEnd.getUTCDate()-(dataEnd<ms?0:0))*(dataEnd>=ms?1:0)};
}
function weeksOf(mi){
  const out=[];
  for(let mon=mi.first;mon<=mi.me;mon=addD(mon,7)){
    const sun=addD(mon,6);
    if(sun<mi.ms||sun>mi.me)continue;
    out.push({mon:iso(mon),sun:iso(sun),done:sun<=mi.yest});
  }
  return out;
}
const SQLS={
 names:(ids)=>`SELECT id, name FROM ${NG}.fleet_company WHERE id IN (${ids})`,
 inc:(ids,s,e)=>`SELECT a.external_id cid, CAST(DATE(CONVERT_TIMEZONE('Europe/Madrid',e.created)) AS STRING) d, ROUND(SUM(e.amount),2) net, ROUND(SUM(CASE WHEN e.external_type IN ('ride_hailing-ride_fee','ride_hailing-toll_road','ride_hailing-bolt_rider_booking_fee','ride_hailing-cancellation_fee','ride_hailing-tips') THEN e.amount ELSE 0 END),2) gross FROM main.ng_payout.invoicing_balance_balance_entry e JOIN main.ng_payout.invoicing_balance_account a ON a.id=e.account_id WHERE a.external_id IN (${ids}) AND a.type IN ('ride_hailing_fleet','ride_hailing_fleet_external') AND e.created_date BETWEEN CAST(DATE_SUB(DATE'${s}',1) AS STRING) AND CAST(DATE_ADD(DATE'${e}',1) AS STRING) AND DATE(CONVERT_TIMEZONE('Europe/Madrid',e.created)) BETWEEN '${s}' AND '${e}' AND e.external_type IN ('ride_hailing-ride_fee','ride_hailing-toll_road','ride_hailing-bolt_rider_booking_fee','ride_hailing-cancellation_fee','ride_hailing-tips','ride_hailing-fee','ride_hailing-bolt_booking_fee_collection') GROUP BY 1,2`,
 ops:(ids,s,e)=>`SELECT driver_company_id cid, CAST(created_date_local AS STRING) d, COUNT(*) tries, SUM(CASE WHEN has_driver_accepted THEN 1 ELSE 0 END) acc, SUM(CASE WHEN order_try_state='finished' THEN 1 ELSE 0 END) rides, SUM(CASE WHEN order_try_state='driver_did_not_respond' THEN 0 WHEN order_try_state='driver_rejected' AND NOT COALESCE(has_driver_accepted,false) THEN 0 ELSE 1 END) den FROM main.core_models.fact_rides_order_try WHERE driver_company_id IN (${ids}) AND created_date_local BETWEEN '${s}' AND '${e}' GROUP BY 1,2`,
 hrs:(ids,s,e)=>`SELECT company_id cid, CAST(date AS STRING) d, ROUND(SUM(has_order_seconds+waiting_orders_seconds)/3600.0,2) oh, ROUND(SUM(has_order_seconds)/3600.0,2) busy FROM ${NG}.driver_online_hours_daily WHERE company_id IN (${ids}) AND date BETWEEN '${s}' AND '${e}' GROUP BY 1,2`,
 rad:(ids,s,e)=>`SELECT company_id cid, CAST(date AS STRING) d, SUM(required_orders_count) req, SUM(accepted_required_orders_count) accr, SUM(accepted_optional_orders_count) acco, SUM(rejected_required_orders_count) rejr FROM ${NG}.driver_reporting_vehicle_acceptance_rate_day WHERE company_id IN (${ids}) AND date BETWEEN '${s}' AND '${e}' AND COALESCE(_deleted_from_source,false)=false GROUP BY 1,2`,
 brand:(ids,s,e)=>`WITH calc AS (SELECT pe.target_id id, fc.company_id cid, CAST(CONVERT_TIMEZONE('Europe/Madrid', pe.start) AS DATE) wk, bc.condition_id, MAX(CASE WHEN b.id IS NOT NULL AND COALESCE(b.state,'') NOT IN ('cancelled','failed') THEN CAST(GET_JSON_OBJECT(b.earning,'$.amount') AS DOUBLE) END) amt FROM ${NG}.conditional_campaigns_period_enrollment pe JOIN ${NG}.conditional_campaigns_campaign camp ON pe.campaign_id=camp.id AND camp.name LIKE '%CarBranding%' JOIN ${NG}.fleet_car fc ON pe.target_id=fc.id AND fc.company_id IN (${ids}) JOIN ${NG}.conditional_campaigns_bonus_calculation bc ON bc.period_enrollment_id=pe.id LEFT JOIN ${NG}.conditional_campaigns_bonus b ON bc.bonus_id=b.id WHERE pe.target_type='car' AND pe.start >= TIMESTAMP'${s} 00:00:00' - INTERVAL 1 DAY AND pe.start < TIMESTAMP'${e} 00:00:00' + INTERVAL 1 DAY GROUP BY 1,2,3,4) SELECT cid, CAST(wk AS STRING) wk, COUNT(DISTINCT id) cars, ROUND(SUM(COALESCE(amt,0)),2) brand FROM calc GROUP BY 1,2`
};
// ---------- cálculo ----------
const N=x=>+x||0;
function agg(opsRows,radRows,from,to){
  const a={gmv:0,netv:0,rides:0,oh:0,busy:0,tries:0,acc:0,reja:0,den:0,req:0,accr:0,acco:0,rejr:0};
  opsRows.forEach(r=>{if(r.d<from||r.d>to)return;a.gmv+=N(r.gross);a.netv+=N(r.net);a.rides+=N(r.rides);a.oh+=N(r.oh);a.busy+=N(r.busy);a.tries+=N(r.tries);a.acc+=N(r.acc);a.reja+=N(r.reja);a.den+=N(r.den);});
  radRows.forEach(r=>{if(r.d<from||r.d>to)return;a.req+=N(r.req);a.accr+=N(r.accr);a.acco+=N(r.acco);a.rejr+=N(r.rejr);});
  return derive(a);
}
function derive(a){
  a.net=a.netv;
  a.accTotal=a.tries>0?a.acc/a.tries*100:null;
  const den=a.accr+a.acco+a.rejr;
  a.accEff=den>0?(a.accr+a.acco)/den*100:null;
  a.comp=a.den>0?a.rides/a.den*100:null;
  a.compAll=a.tries>0?a.rides/a.tries*100:null;
  a.util=a.oh>0?a.busy/a.oh*100:null;
  a.rph=a.oh>0?a.rides/a.oh:null;
  a.eph=a.oh>0?a.gmv/a.oh:null;
  return a;
}
function tierOf(rides){let t=0;TIERS.forEach(([n,p])=>{if(rides>=n)t=p;});return t;}
function compute(d){
  const mi=d.mi;
  const from=iso(mi.ms), to=iso(mi.dataEnd);
  const m=agg(d.ops,d.rad,from,to);
  const wks=weeksOf(mi).map(w=>{
    const a=agg(d.ops,d.rad,w.mon,w.sun);
    const br=d.brand.filter(r=>r.wk===w.mon);
    a.brand=br.reduce((s,r)=>s+N(r.brand),0); a.cars=br.reduce((s,r)=>s+N(r.cars),0);
    a.mon=w.mon;a.sun=w.sun;a.done=w.done;
    a.brandPct=w.done&&a.gmv>0?a.brand/a.gmv*100:null;
    return a;
  });
  const dw=wks.filter(w=>w.done);
  const brand=dw.reduce((s,w)=>s+w.brand,0), gAl=dw.reduce((s,w)=>s+w.gmv,0);
  m.brand=brand; m.brandPct=gAl>0?brand/gAl*100:null;
  // kickback de flota
  const tier=tierOf(m.rides);
  const room=Math.max(0,CAP-(m.brandPct||0))/100*m.gmv;
  m.tier=tier; m.fleetGross=tier/100*m.gmv; m.fleet=Math.min(m.fleetGross,room); m.capped=m.fleetGross>room+0.005;
  m.fleetPct=m.gmv>0?m.fleet/m.gmv*100:null;
  m.supplyPct=m.brandPct==null?null:m.brandPct+(m.fleetPct||0);
  const elapsed=Math.max(1,mi.dataEnd.getUTCDate());
  m.proj=mi.closed?m.rides:m.rides/elapsed*mi.days;
  m.projTier=tierOf(m.proj);
  m.projGmv=mi.closed?m.gmv:m.gmv/elapsed*mi.days;
  m.projFleet=Math.min(m.projTier/100*m.projGmv,Math.max(0,CAP/100*m.projGmv-(m.brandPct!=null?m.brandPct/100*m.projGmv:brand)));
  // por company
  const cos={};
  d.snap.ids.forEach(id=>cos[id]={id,gmv:0,net:0,gAl:0,rides:0,oh:0,busy:0,brand:0});
  d.ops.forEach(r=>{if(r.d<from||r.d>to)return;const c=cos[r.cid]||(cos[r.cid]={id:+r.cid,gmv:0,net:0,gAl:0,rides:0,oh:0,busy:0,brand:0});c.gmv+=N(r.gross);c.net+=N(r.net);c.rides+=N(r.rides);c.oh+=N(r.oh);c.busy+=N(r.busy);if(r.gross!=null&&dw.some(w=>r.d>=w.mon&&r.d<=w.sun))c.gAl+=N(r.gross);});
  const doneMons=new Set(dw.map(w=>w.mon));
  d.brand.forEach(r=>{if(!doneMons.has(r.wk))return;const c=cos[r.cid];if(c)c.brand+=N(r.brand);});
  // serie diaria: del día 1 al último día completo; el supply spend de cada día es el % de su semana (solo semanas cerradas del mes)
  const dayAgg={};
  d.ops.forEach(r=>{if(r.d<from||r.d>to)return;const x=dayAgg[r.d]||(dayAgg[r.d]={gmv:0,rides:0});x.gmv+=N(r.gross);x.rides+=N(r.rides);});
  const days=[];
  for(let t=mi.ms;t<=mi.dataEnd;t=addD(t,1)){
    const ds=iso(t), mon=iso(addD(t,-((t.getUTCDay()+6)%7)));
    const w=wks.find(x=>x.mon===mon);
    const a=dayAgg[ds]||{gmv:0,rides:0};
    days.push({d:ds,gmv:a.gmv,rides:a.rides,sp:w&&w.done&&w.brandPct!=null?w.brandPct+(m.fleetPct||0):null});
  }
  return {m,wks,cos:Object.values(cos),days};
}

// ---------- render ----------
let CUR=null,chart=null;
function kpi(l,v,s,cls){return `<div class="kpi ${cls||""}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`;}
function render(d){
  CUR=d;
  const mi=d.mi;
  const lab=MES[+mi.ym.slice(5)-1]+" "+mi.ym.slice(0,4);
  const frozenTxt=mi.closed?(d.snap.frozen?"lista de companies congelada":"sin snapshot: usando lista en vivo"):"lista en vivo del Sheet";
  $("sub").textContent=(mi.closed?"Mes cerrado":"Mes en curso (MTD)")+" · "+lab+" · "+d.snap.ids.length+" companies";
  if(d.empty){
    $("kpis").innerHTML="";$("tierBar").innerHTML="";$("tierGrid").innerHTML="";$("tWeeks").innerHTML="";$("tFleets").innerHTML="";
    setStatus("Todavía no hay datos cerrados de "+lab+" (los datos llegan a día vencido).");return;
  }
  const c=d.frozenC||compute(d), m=c.m;
  const over=m.supplyPct!=null&&m.supplyPct>CAP+0.0001;
  const mtd=mi.closed?"":"MTD hasta "+iso(mi.dataEnd).split("-").reverse().join("/");
  $("kpis").innerHTML=[
    kpi("Ingresos brutos",eur(m.gmv),mtd||"mes cerrado"),
    kpi("Ingresos netos",eur(m.net),"tras comisión Bolt ("+pct(m.gmv>0?m.net/m.gmv*100:null)+" de los brutos)"),
    kpi("Aceptación total",pct(m.accTotal),"aceptados / order tries"),
    kpi("Aceptación efectiva",pct(m.accEff),"órdenes dentro del radio"),
    kpi("Tasa de finalización",pct(m.comp),"viajes aceptados · todos los viajes: "+pct(m.compAll)),
    kpi("Utilización",pct(m.util),"horas con viaje / horas online"),
    kpi("Rides",nf(m.rides),mi.closed?"":"proyección cierre: "+nf(m.proj)),
    kpi("RPH",nf(m.rph,2),"rides por hora online"),
    kpi("EPH",eur(m.eph,2),"ingresos brutos por hora online"),
    kpi("Branding spend",pct(m.brandPct),eur(m.brand)+" · semanas cerradas","sp"),
    kpi("Fleet bonus spend",pct(m.fleetPct),eur(m.fleet)+(m.capped?" · recortado por tope":"")+(m.tier?" · nivel "+m.tier+"%":" · sin nivel"),"sp"),
    kpi("Supply spend",pct(m.supplyPct),"tope "+pct(CAP)+(over?" · SUPERADO":""),"sp"+(over?" over":""))
  ].join("");
  // kickback
  const max=TIERS[TIERS.length-1][0]*1.08;
  const pos=v=>Math.min(100,v/max*100);
  let bar=`<div class="fill" style="width:${pos(m.rides)}%"><span class="ft">Viajes acumulados${mi.closed?"":" MTD"}: ${nf(m.rides)}</span></div>`;
  TIERS.forEach(([n,p])=>{bar+=`<div class="tk" style="left:${pos(n)}%"></div><div class="tl" style="left:${pos(n)}%"><b>${p}%</b>${nf(n)}</div>`;});
  if(!mi.closed)bar+=`<div class="proj" style="left:${pos(m.proj)}%"></div><div class="pl" style="left:${pos(m.proj)}%;color:var(--warn)">proyección ${nf(m.proj)}</div>`;
  $("tierBar").innerHTML=bar;
  $("tierSub").textContent=nf(m.rides)+" rides"+(mi.closed?"":" · MTD");
  $("tierGrid").innerHTML=[
    ["Viajes acumulados",nf(m.rides)],
    ["Nivel alcanzado",m.tier?"Nivel "+m.tier+"%":"Sin nivel",(()=>{const n=TIERS.find(t=>t[0]>m.rides);return n?"Faltan "+nf(n[0]-m.rides)+" viajes para el nivel "+n[1]+"%":"Nivel máximo alcanzado";})()],
    ["Fleet bonus",eur(m.fleet)+(m.capped?" (recortado por el tope)":""),(m.tier?m.tier+"% × "+eur(m.gmv)+" de ingresos brutos":"Sin nivel alcanzado")+" · Condicionado a un Supply Spend máximo de "+pct(CAP)],
    mi.closed?null:["Nivel proyectado",(m.projTier?m.projTier+"%":"Sin nivel")+" · ≈ "+eur(m.projFleet)],
  ].filter(Boolean).map(([l,v,s])=>`<div><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:""}</div>`).join("");
  // semanas
  const wkLab=w=>{const a=w.mon.split("-"),b=w.sun.split("-");return a[2]+"/"+a[1]+" – "+b[2]+"/"+b[1];};
  const hd="<thead><tr><th>Semana</th><th>Ingresos brutos</th><th>Ingresos netos</th><th>Acept. total</th><th>Acept. efectiva</th><th>Finaliz.</th><th>Utiliz.</th><th>Rides</th><th>RPH</th><th>EPH</th><th>Branding €</th><th>Branding %</th></tr></thead>";
  const row=w=>`<tr><td>${wkLab(w)}${w.done?"":' <span class="chip w">en curso</span>'}</td><td>${eur(w.gmv)}</td><td>${eur(w.net)}</td><td>${pct(w.accTotal)}</td><td>${pct(w.accEff)}</td><td>${pct(w.comp)}</td><td>${pct(w.util)}</td><td>${nf(w.rides)}</td><td>${nf(w.rph,2)}</td><td>${eur(w.eph,2)}</td><td>${w.done?eur(w.brand):"—"}</td><td>${pct(w.brandPct)}</td></tr>`;
  $("tWeeks").innerHTML=hd+"<tbody>"+c.wks.map(row).join("")+`</tbody><tfoot><tr><td>Mes (${mi.closed?"cerrado":"MTD"})</td><td>${eur(m.gmv)}</td><td>${eur(m.net)}</td><td>${pct(m.accTotal)}</td><td>${pct(m.accEff)}</td><td>${pct(m.comp)}</td><td>${pct(m.util)}</td><td>${nf(m.rides)}</td><td>${nf(m.rph,2)}</td><td>${eur(m.eph,2)}</td><td>${eur(m.brand)}</td><td>${pct(m.brandPct)}</td></tr></tfoot>`;
  $("wkSub").textContent="el branding se paga cuando la semana cierra";
  // flotas
  const names=d.names||d.snap.names||{};
  const cos=c.cos.sort((a,b)=>b.rides-a.rides);
  const frow=x=>`<td>${eur(x.gmv)}</td><td>${eur(x.net)}</td><td>${nf(x.rides)}</td><td>${nf(x.oh)}</td><td>${pct(x.oh>0?x.busy/x.oh*100:null)}</td><td>${nf(x.oh>0?x.rides/x.oh:null,2)}</td><td>${eur(x.oh>0?x.gmv/x.oh:null,2)}</td><td>${eur(x.brand)}</td><td>${pct(x.gAl>0?x.brand/x.gAl*100:null)}</td>`;
  const tot={gmv:m.gmv,net:m.net,rides:m.rides,oh:m.oh,busy:m.busy,brand:m.brand,gAl:cos.reduce((s,x)=>s+x.gAl,0)};
  $("tFleets").innerHTML="<thead><tr><th>Flota</th><th>Company ID</th><th>Ingresos brutos</th><th>Ingresos netos</th><th>Rides</th><th>OH</th><th>Utiliz.</th><th>RPH</th><th>EPH</th><th>Branding €</th><th>Branding spend %</th></tr></thead><tbody>"+
    cos.map(x=>`<tr><td>${esc(names[x.id]||"—")}</td><td>${x.id}</td>${frow(x)}</tr>`).join("")+`</tbody><tfoot><tr><td>Total</td><td>${cos.length} flotas</td>${frow(tot)}</tr></tfoot>`;
  const isoWk=s=>{const t=parseD(s);const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=U(t.getUTCFullYear(),0,4);return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);};
  const dm=s=>s.slice(8)+"/"+s.slice(5,7);
  $("flNote").innerHTML="<b>Semanas de branding atribuidas a "+MES[+mi.ym.slice(5)-1]+":</b> "+c.wks.map(w=>"W"+isoWk(w.mon)+" ("+dm(w.mon)+"–"+dm(w.sun)+")"+(w.done?"":" en curso, aún sin bonus")).join(" · ")+". Cada semana Lun–Dom cuenta en el mes en que termina; el % de branding usa solo las semanas cerradas.";
  $("flSub").innerHTML=`<span class="chip ${d.snap.frozen||!mi.closed?"":"w"}">${esc(frozenTxt)}</span>`;
  // gráfico
  const days=c.days||[];
  const labels=days.map(x=>x.d.slice(8)+"/"+x.d.slice(5,7));
  const css=getComputedStyle(document.documentElement);
  const col=n=>css.getPropertyValue(n).trim();
  if(chart)chart.destroy();
  chart=new Chart($("chart"),{data:{labels,datasets:[
    {type:"bar",label:"Ingresos brutos (€)",data:days.map(x=>Math.round(x.gmv)),backgroundColor:col("--accent"),borderRadius:3,yAxisID:"y",order:3},
    {type:"line",label:"Rides",data:days.map(x=>x.rides),borderColor:col("--warn"),backgroundColor:col("--warn"),pointRadius:2,borderWidth:2,tension:.25,yAxisID:"y2",order:2},
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{color:col("--muted"),font:{family:"Inter"}}}},
    scales:{x:{grid:{display:false},ticks:{color:col("--muted")}},y:{grid:{color:col("--grid")},ticks:{color:col("--muted")}},y2:{position:"right",grid:{drawOnChartArea:false},ticks:{color:col("--muted")},suggestedMin:0}}}});
  setStatus((mi.closed?(d.frozenAt?"Cifras congeladas el "+d.frozenAt.slice(0,10).split("-").reverse().join("/"):"Mes cerrado, cifras aún sin congelar (se congelan el día "+FREEZE_DAY+")"):"Datos a día vencido, hasta el "+iso(mi.dataEnd).split("-").reverse().join("/"))+" · "+d.snap.ids.length+" companies ("+frozenTxt+(d.snap.fresh?", congelada ahora":"")+")"+(d.frozenAt?"":" · consultado "+d.loaded.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})));
}
function renderCond(){
  $("condBody").innerHTML=`
  <h3>Acuerdo con VTC Plus</h3>
  <p>Vigente desde el 1 de octubre de 2026. Combina un incentivo por coche (campañas CarBranding) y un kickback mensual de flota.</p>
  <h3>1. Incentivo por coche · Branding</h3>
  <p>Bonus semanal de las campañas CarBranding de cada coche (datos de condiciones y cumplimiento en Looker, <i>conditional campaigns</i>). Aquí se suma el importe ganado por coche y semana. Una semana Lun–Dom cuenta en el mes en que termina.</p>
  <h3>2. Incentivo mensual · Kickback de flota</h3>
  <table><thead><tr><th>Rides del mes</th><th>% ingresos brutos</th></tr></thead><tbody>${TIERS.map(([n,p])=>`<tr><td>≥ ${nf(n)}</td><td>${p}%</td></tr>`).join("")}</tbody></table>
  <h3>3. Tope de supply spend</h3>
  <p>El supply spend del mes (branding spend % + fleet bonus spend %) no puede superar el ${pct(CAP)} de los ingresos brutos. Si el kickback del nivel lo superara, el Fleet bonus se recorta hasta el margen que deja el branding.</p>
  <h3>Definiciones</h3>
  <ul>
   <li><b>Ingresos brutos</b>: movimientos de la cuenta de la flota en payouts (tarifa, peajes, booking fee, cancelaciones y propinas). <b>Ingresos netos</b>: los mismos movimientos tras las comisiones de Bolt.</li>
   <li><b>Viajes, aceptación total y finalización</b>: order tries de <code>fact_rides_order_try</code> por company del conductor y fecha local de creación, como el portal. Viajes = tries terminados. <b>Aceptación total</b> = tries aceptados / todos los tries. Horas y utilización salen de <code>driver_online_hours_daily</code>.</li>
   <li><b>Aceptación efectiva</b>: (aceptadas obligatorias + opcionales) / (aceptadas + rechazadas obligatorias); obligatorias = órdenes dentro del radio (<code>driver_reporting_vehicle_acceptance_rate_day</code>).</li>
   <li><b>Tasa de finalización</b>: viajes terminados / viajes aceptados, como la columna "Tasa de finalización (viajes aceptados)" de Flota › Conductores. En el portal, "viajes aceptados" son los order tries menos los que el conductor no respondió y los que rechazó antes de aceptar; por eso incluye también los cancelados por el cliente antes de que el conductor aceptara. Se muestra también la de todos los viajes (terminados / todos los order tries). Calculada sobre el total de la flota equivale a ponderar la de cada conductor por ese denominador. Contraste con el portal (company 109555, oct.): coinciden viajes, aceptación total y las dos tasas de finalización.</li>
   <li><b>Conciliación con el portal</b>: los ingresos de este tracker son los de la vista Finanzas sin campañas. En el portal, la vista Vehículos suma además las campañas de vehículos (branding). Ejemplo, company 109555, octubre: €16,016.72 + €1,718.03 de campañas = €17,734.75 brutos en Vehículos. Finanzas › Ingresos por conductor añade otros €26.25 de campañas de flota (€16,042.97).</li>
   <li><b>Utilización</b>: horas con viaje / (horas con viaje + horas de espera). <b>RPH</b>: rides / hora online. <b>EPH</b>: ingresos brutos / hora online.</li>
   <li><b>Branding %</b>: bonus de las semanas cerradas del mes / bruta de esas mismas semanas. <b>Fleet bonus %</b>: Fleet bonus / bruta del mes natural.</li>
  </ul>
  <h3>Mes en curso y mes cerrado</h3>
  <ul><li>Datos a día vencido (hasta ayer, hora de Madrid). En el mes en curso, el nivel de kickback se muestra con los rides acumulados y una proyección lineal al cierre.</li>
  <li>Cada mes cerrado se congela el día ${FREEZE_DAY} del mes siguiente: se guardan la lista de companies y todas las cifras (KPIs, semanas y flotas) en el repositorio (carpeta data/closed) y ya no se vuelven a consultar. Antes de esa fecha el mes se calcula en vivo. Los datos de octubre dejaron de cambiar el 2 de noviembre (7 de 62,012 order tries se actualizaron después, ninguna hora online y ningún bonus de branding). Altas y bajas en el Sheet solo afectan al mes en curso y siguientes.</li></ul>
  <h3>Companies de este mes</h3>
  <div>${(CUR&&CUR.snap?CUR.snap.ids:[]).map(i=>`<span class="pill">${i}</span>`).join("")}</div>`;
}

// ---------- datos incrustados por build.js ----------
const FREEZE_DAY=3;
function loadMonth(ym){
  const b=((window.BAKED||{}).months||{})[ym];
  if(!b)return null;
  const mi=monthInfo(ym); mi.dataEnd=parseD(b.dataEnd);
  const names=b.names||{};
  return {mi,snap:{ids:b.ids.map(Number),names,frozen:!!b.frozenAt},names,frozenC:b.c,frozenAt:b.frozenAt||null,loaded:new Date(b.asOf)};
}
function show(){
  const ym=$("selMonth").value;lsSet("vtcp_month",ym);
  const d=loadMonth(ym);
  if(!d){setStatus("Sin datos para este mes",true);return;}
  render(d);renderCond();
}
function init(){
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.t));
  });
  const B=window.BAKED;
  if(!B||!B.months||!Object.keys(B.months).length){setStatus("Sin datos incrustados todavía",true);return;}
  const months=Object.keys(B.months).sort();
  $("selMonth").innerHTML=months.slice().reverse().map(x=>`<option value="${x}">${MES[+x.slice(5)-1]} ${x.slice(0,4)}</option>`).join("");
  const saved=lsGet("vtcp_month");
  $("selMonth").value=months.includes(saved)?saved:months[months.length-1];
  $("selMonth").onchange=show;
  renderCond();
  show();
}
init();
</script>
